[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splat-trimmer"
version = "0.1.0"
description = "CLI and library for trimming Gaussian splat clouds (AABB, sphere, OBB, decimation)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Siddharth Fulia" }]
keywords = ["gaussian-splatting", "3dgs", "point-cloud", "ply", "splat"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "numpy>=1.26",
    "plyfile>=1.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
splat-trimmer = "splat_trimmer.cli:app"

[project.urls]
Homepage = "https://github.com/SiddharthFulia/splat-trimmer"
Issues = "https://github.com/SiddharthFulia/splat-trimmer/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
splat_trimmer = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
